# Windows .exe only — the APK and the Linux bundle are built locally
# (tool/package_release.sh). This exists because the Windows build needs MSVC,
# which only runs on Windows; GitHub's windows-latest runner has it.
#
# How to use:
#   1. push this project to a GitHub repository (private is fine)
#   2. Actions tab -> "Build Windows exe" -> Run workflow
#   3. download the pchat-windows artifact from the finished run
#
# The zip contains the whole Release folder: keep data/ and the .dll files
# next to pchat_app.exe — copying only the .exe will not run.

name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The build log is kept and, when the build fails, copied into the job
      # summary — the summary is readable straight from the run page, so a
      # failure can be diagnosed without digging through the raw log.
      - name: Build the Windows release
        shell: pwsh
        run: |
          $log = "build-output.log"
          flutter build windows --release *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## flutter build windows --release failed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "```text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content $log -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $code

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore

      - name: Zip the release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
                           -DestinationPath dist/windows/pchat_app-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: pchat-windows
          path: dist/windows/pchat_app-windows-x64.zip
          if-no-files-found: error