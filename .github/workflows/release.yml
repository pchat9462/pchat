# Windows .exe only — the APK and the Linux bundle are built locally
# (tool/package_release.sh). This exists because the Windows build needs MSVC,
# which only runs on Windows; GitHub's windows-latest runner has it.
#
# How to use:
#   1. push this project to a GitHub repository (private is fine)
#   2. Actions tab -> "Build Windows exe" -> Run workflow
#   3. download the pchat-windows artifact from the finished run
#
# The zip contains the whole Release folder: keep data/ and the .dll files
# next to pchat_app.exe — copying only the .exe will not run.

name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The build log is kept and, when the build fails, copied into the job
      # summary — the summary is readable straight from the run page, so a
      # failure can be diagnosed without digging through the raw log.
      - name: Build the Windows release
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## flutter build windows --release failed"
              echo '```text'
              tail -120 build-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore

      # The raw log is also pushed to a `ci-logs` branch, where it can be read
      # straight from a raw URL — GitHub hides the run logs and the job summary
      # from anyone who is not signed in.
      - name: Push the build log to the ci-logs branch
        if: always()
        shell: bash
        run: |
          if [ -f build-output.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p ci-logs
            cp build-output.log "ci-logs/build-${{ github.run_id }}.log"
            git checkout -B ci-logs
            git add ci-logs
            git commit -m "ci: build log for run ${{ github.run_id }}" || true
            git push origin ci-logs --force
          fi

      - name: Zip the release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
                           -DestinationPath dist/windows/pchat_app-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: pchat-windows
          path: dist/windows/pchat_app-windows-x64.zip
          if-no-files-found: error

      # ── The installer ───────────────────────────────────────────────────
      # A single .exe that installs the app: Desktop shortcut, Start menu
      # entry and an entry in "Apps", all with PCHAT's own icon.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes --limit-output

      - name: Build the installer
        shell: bash
        run: |
          set -e
          iscc=$(find "/c/Program Files (x86)" "/c/Program Files" -name ISCC.exe 2>/dev/null | head -1)
          if [ -z "$iscc" ]; then
            echo "Inno Setup's compiler was not found" >&2
            exit 1
          fi
          echo "Using $iscc"
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          "$iscc" "/DAppVersion=$version" tool/windows_installer.iss
          ls -la dist/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: pchat-installer
          path: dist/windows/pchat_app-*-windows-x64-installer.exe
          if-no-files-found: error